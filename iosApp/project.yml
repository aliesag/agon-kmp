name: iosApp
options: { bundleIdPrefix: com.toner, deploymentTarget: { iOS: "15.0" } }
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toner.yxvaiz
        PRODUCT_NAME: Agon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: iosApp/Info.plist
      properties:
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }   # scraped streams are often plain http
        UIBackgroundModes: [audio]                                 # keep playback alive in background
    preBuildScripts:
      - name: Build Kotlin framework
        script: |
          cd "$SRCROOT/.." && ./gradlew :shared:embedAndSignAppleFrameworkForXcode
