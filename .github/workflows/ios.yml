name: ios-ipa
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen
          # Newer XcodeGen writes objectVersion=77 (Xcode 16 format),
          # but macos-14 ships Xcode 15.4. Downgrade so Xcode 15 can open it.
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 60;/' iosApp.xcodeproj/project.pbxproj
          grep -m1 objectVersion iosApp.xcodeproj/project.pbxproj
      - name: Build unsigned
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
      - name: Package ipa
        run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Agon.app Payload/
          zip -qr Agon.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Agon-unsigned-ipa, path: Agon.ipa }
