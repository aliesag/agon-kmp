name: ios-ipa
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: brew install xcodegen
      - name: Pre-download Gradle distribution
        run: |
          set -e
          GRADLE_VER=8.11.1
          DEST="$HOME/.gradle/wrapper/dists/gradle-$GRADLE_VER-bin"
          mkdir -p "$DEST"
          # Find the hashed subdir Gradle expects, or let wrapper do it once
          for url in \
            "https://downloads.gradle.org/distributions/gradle-$GRADLE_VER-bin.zip" \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VER-bin.zip" \
            "https://github.com/gradle/gradle-distributions/releases/download/v$GRADLE_VER/gradle-$GRADLE_VER-bin.zip"; do
            if curl -fSL --retry 3 --retry-delay 2 -o "/tmp/gradle.zip" "$url"; then
              echo "downloaded from $url"
              # Compute expected hash dir the wrapper uses (it's a hex of the URL)
              HASH=$(printf "%s" "$url" | shasum | cut -d' ' -f1)
              mkdir -p "$DEST/$HASH"
              unzip -q "/tmp/gradle.zip" -d "$DEST/$HASH"
              # remove zip and create ok marker
              touch "$DEST/$HASH/gradle-$GRADLE_VER-bin.zip.ok"
              exit 0
            fi
          done
          echo "failed to download gradle"; exit 1
      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen
          # Newer XcodeGen writes objectVersion=77 (Xcode 16 format),
          # but macos-14 ships Xcode 15.4. Downgrade so Xcode 15 can open it.
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 60;/' iosApp.xcodeproj/project.pbxproj
          grep -m1 objectVersion iosApp.xcodeproj/project.pbxproj
      - name: Build unsigned
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
      - name: Package ipa
        run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Agon.app Payload/
          zip -qr Agon.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Agon-unsigned-ipa, path: Agon.ipa }
